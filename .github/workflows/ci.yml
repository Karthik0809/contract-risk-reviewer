name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic langgraph reportlab python-docx pytest
      - name: Run tests
        run: python -m pytest test_contract_reviewer.py -q
      - name: Run evaluation (gated on recall & precision)
        run: python eval/run_eval.py --min-recall 0.90 --min-precision 0.95
